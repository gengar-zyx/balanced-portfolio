name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: mcp-ci-test-only
          POSTGRES_DB: bp_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bp_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BP_JWT_SECRET: ci-only-jwt-secret-not-for-production
      BP_MCP_TEST_DSN: postgresql://postgres:mcp-ci-test-only@localhost:5432/bp_mcp_test
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest bp_api/tests -q
      - run: python -m bp_ingest --help
      - run: python -c "from bp_api.main import app; print(f'{len(app.routes)} routes')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
