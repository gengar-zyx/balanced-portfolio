# Overlay for Docker Compose deployments whose base file defines `db` and `redis`.
# Set BP_API_IMAGE to the same application image used by the API service when its
# Compose-generated image name differs from balanced-portfolio-api.
services:
  feishu-bot:
    image: ${BP_API_IMAGE:-balanced-portfolio-api}
    command: ["python", "-m", "bp_api.feishu_bot"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
