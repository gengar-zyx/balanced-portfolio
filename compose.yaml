name: balanced-portfolio

x-backend: &backend
  build:
    context: .
    target: backend
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: docker.m.daocloud.io/timescale/timescaledb:latest-pg18
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./ddl/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/library/redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["uvicorn", "bp_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    <<: *backend
    command: ["celery", "-A", "bp_api.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "bp_api.workers.celery_app", "beat", "--loglevel=INFO"]

  ingest:
    <<: *backend
    command: ["python", "-m", "bp_ingest", "schedule"]

  feishu-bot:
    <<: *backend
    command: ["python", "-m", "bp_api.feishu_bot"]

  web:
    build:
      context: .
      target: web
      args:
        BP_API_BASE: http://api:8000
    env_file: .env
    environment:
      BP_API_BASE: http://api:8000
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
